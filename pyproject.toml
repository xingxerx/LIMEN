[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "limen-compiler"
version = "0.8.4"
description = "A physics-aware compiler stack for translating classical optimization problems into native quantum and analog substrates."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = [
  "quantum computing",
  "optimization",
  "QUBO",
  "compiler",
  "quantum annealing",
  "physics-native computing",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
pyqubo = ["pyqubo>=1.4"]
dwave = ["dwave-ocean-sdk>=6.0"]
# qiskit<2.5: qiskit 2.5.0 removed/restructured qiskit.transpiler.preset_passmanagers.common,
# which qiskit-aer 0.17.2's internal transpile path still imports -- breaks AerSimulator.run()
# with AttributeError until qiskit-aer catches up. Revisit this cap once a qiskit-aer release
# is confirmed compatible with qiskit>=2.5.
ibm = ["qiskit>=1.0,<2.5", "qiskit-aer>=0.14"]
braket = ["amazon-braket-sdk>=1.70"]
openquantum = ["openquantum-sdk"]
cutting = ["qiskit-addon-cutting>=0.9", "qiskit-ibm-runtime>=0.25"]
distributed = [
  "grpcio>=1.60",
  "grpcio-tools>=1.60",
  "protobuf>=4.25",
  "grpcio-health-checking>=1.60",
  "cryptography>=48",
]
# cryptography>=48: the first version confirmed (locally + in CI) to expose
# hazmat.primitives.asymmetric.mldsa (ML-DSA, FIPS 204), used by
# limen.security.pqc to sign persisted/exchanged artifacts. This version
# also exposes mlkem (ML-KEM, FIPS 203, key encapsulation) but nothing in
# limen currently uses it -- signing-at-rest was the stated scope, not
# encryption/key exchange. Split into its own extra so post-quantum
# signing doesn't require the full grpcio/distributed stack.
pqc = ["cryptography>=48"]
all = [
  "pyqubo>=1.4",
  "dwave-ocean-sdk>=6.0",
  "qiskit>=1.0,<2.5",
  "qiskit-aer>=0.14",
  "amazon-braket-sdk>=1.70",
  "openquantum-sdk",
  "qiskit-addon-cutting>=0.9",
  "qiskit-ibm-runtime>=0.25",
  "grpcio>=1.60",
  "grpcio-tools>=1.60",
  "protobuf>=4.25",
  "grpcio-health-checking>=1.60",
  "cryptography>=48",
]

[project.scripts]
limend = "limen.limend.__main__:main"

[project.urls]
"Homepage" = "https://github.com/xingxerx/LIMEN"
"Bug Tracker" = "https://github.com/xingxerx/LIMEN/issues"
"Documentation" = "https://github.com/xingxerx/LIMEN#readme"

[tool.pytest.ini_options]
markers = [
    "network: requires live network access (distributed transport tests)",
    "slow: known slow, not part of the default fast gate",
]

[tool.maturin]
module-name = "limen.limen_core"
features = ["pyo3/extension-module"]
python-packages = ["limen"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = ["."]
