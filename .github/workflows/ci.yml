name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --release

  python-test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all optional backends (builds limen_core via maturin)
        run: pip install ".[all]"
      - name: Install test dependencies
        run: pip install -r requirements-ci.txt
      - name: Run test suite
        run: pytest tests/ -q

  # Self-improvement loop verdict (harness-roadmap/03, ATRIUM AGENTS.md
  # section 5: "agents propose, the harness disposes"). Any claim file
  # under policy_proposals/pending/ must replay as a non-regression
  # against the ledger built from results/ before it can land -- this
  # job is the CI verdict step; make it a required status check on main
  # once branch protection is configured (owner action, see BUILD.md
  # GAP 0 / GAP 5 for the same pattern already applied to e2e-smoke).
  policy-proposal-verdict:
    name: routing-policy proposal verdict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package (simulator path only)
        run: pip install .
      - name: Proposer report (informational; writes nothing)
        run: python scripts/propose.py
      - name: Evaluate every pending proposal
        run: |
          shopt -s nullglob
          claims=(policy_proposals/pending/*.claim.json)
          if [ ${#claims[@]} -eq 0 ]; then
            echo "no pending routing-policy proposals"
            exit 0
          fi
          status=0
          for claim in "${claims[@]}"; do
            echo "::group::$claim"
            python scripts/run_proposal.py "$claim" || status=1
            echo "::endgroup::"
          done
          exit $status
