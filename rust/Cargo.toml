[workspace]
resolver = "2"
members = ["limen-ir", "limen-qasm", "limen-pass", "limen-backend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
sha2 = "0.10"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
